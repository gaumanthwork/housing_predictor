services:
  housing-api:
    build: ./housing-api
    ports:
      - "${FASTAPI_PORT:-8000}:8000"

  market-analysis-api:
    build: ./market-analysis-api
    environment:
      FASTAPI_URL: http://housing-api:8000
      MARKET_DB_PATH: /data/market
    volumes:
      - market-data:/data
    ports:
      - "${JAVA_PORT:-8080}:8080"
    depends_on:
      - housing-api

volumes:
  market-data:
