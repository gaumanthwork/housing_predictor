server:
  port: ${PORT:8080}
spring:
  application:
    name: market-analysis-api
  datasource:
    url: jdbc:h2:file:${MARKET_DB_PATH:./data/market};DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cache:
    caffeine:
      spec: maximumSize=200,expireAfterWrite=5m
model-api:
  base-url: ${FASTAPI_URL:http://127.0.0.1:8000}
springdoc:
  swagger-ui:
    path: /docs
